<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JD Precompta</title>

    <!-- Logo/monogramme JD Consult (voir skill jd-consult-charte, logo_monogramme) — onglet
         navigateur, favori, et icône d'ajout à l'écran d'accueil (iOS/Android). Le SVG sert de
         source ; les PNG sont un repli pour les navigateurs/plateformes qui ne savent pas encore
         afficher un favicon vectoriel. -->
    <!-- data-favicon-default : repère utilisé par useCabinetBranding (src/lib/branding.ts) pour
         détacher ces icônes quand un cabinet a son propre logo, et les remettre en place sinon —
         un cabinet en marque blanche ne doit jamais voir le monogramme JD Consult à la place du sien. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" data-favicon-default />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" data-favicon-default />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" data-favicon-default />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" data-favicon-default />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0F2438" />
    <meta name="apple-mobile-web-app-title" content="JD Precompta" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Manrope : police d'interface par défaut (voir index.css) — Inter reste chargée en repli et
         pour les cabinets ayant déjà choisi une police à eux (voir lib/branding.ts). -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Posé avant le premier rendu pour éviter un flash de thème clair au chargement si le thème
      // sombre a été choisi précédemment (localStorage) ou est celui du système.
      (function () {
        try {
          var stored = localStorage.getItem('jd-precompta-theme')
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
